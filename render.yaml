services:
  - type: web
    name: mizx
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "1"
      # Canonical public origin returned in API links. Change this if you fork
      # the project or attach a custom domain. When this is blank, the server
      # automatically uses Render's RENDER_EXTERNAL_URL.
      - key: PUBLIC_URL
        value: https://mizx.onrender.com
